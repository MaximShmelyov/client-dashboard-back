name: Deploy Backend via Docker Compose

on:
  push:
    branches:
      - vpsdeploy

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set image repo name (lowercase)
        id: repo
        run: |
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set build version
        id: version
        run: |
          DATE=$(date +'%Y%m%d_%H%M%S')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "version=${DATE}_${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.repo_lowercase }}/backend:${{ steps.version.outputs.version }}
          labels: |
            clientdashboardback.image.source=${{ github.repository }}
            clientdashboardback.image.revision=${{ github.sha }}
            clientdashboardback.image.created=${{ github.run_id }}
            clientdashboardback.image.version=${{ steps.version.outputs.version }}

      - name: SSH to VPS and deploy updated backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            BRANCH="vpsdeploy"
            cd /home/${{ secrets.VPS_USER }}/apps/client-dashboard-back
            git fetch origin $BRANCH
            git checkout $BRANCH
            git pull origin $BRANCH

            docker compose pull backend
            docker compose up -d backend
