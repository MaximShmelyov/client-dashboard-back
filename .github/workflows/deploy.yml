name: Deploy Backend via Docker Compose

on:
  push:
    branches:
      - vpsdeploy

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: maximshmelyov
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/maximshmelyov/client-dashboard-back/backend:latest

      - name: SSH to VPS and deploy updated backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            BRANCH="vpsdeploy"
            cd /home/${{ secrets.VPS_USER }}/apps/client-dashboard-back
            git fetch origin $BRANCH
            git checkout $BRANCH
            git pull origin $BRANCH
            if ! docker compose pull backend; then
              echo "Pull failed, building backend locally..."
              docker compose build backend
            fi
            docker compose up -d backend
