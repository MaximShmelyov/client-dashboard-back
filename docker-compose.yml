services:
  backend:
    build: .
    container_name: client-dashboard-backend-api
    restart: always
    env_file: .env
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - client-dashboard-backend-network

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - client-dashboard-backend-network

  mongo:
    image: mongo:6
    container_name: mongo-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - client-dashboard-backend-network

  redis:
    image: redis:7.0.15-alpine
    container_name: redis-cache
    restart: always
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_SECRET}',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    environment:
      REDIS_SECRET: ${REDIS_SECRET}
    ports:
      - '6379:6379'
    networks:
      - client-dashboard-backend-network

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - client-dashboard-backend-network

volumes:
  postgres_data:
  mongo_data:

networks:
  client-dashboard-backend-network:
    driver: bridge
