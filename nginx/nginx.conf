events {}

http {
  server {
    listen 80;
    server_name dev.api.makestack.eu;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name dev.api.makestack.eu;

    ssl_certificate /etc/letsencrypt/live/dev.api.makestack.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.api.makestack.eu/privkey.pem;

    location / {
      proxy_pass http://backend:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
