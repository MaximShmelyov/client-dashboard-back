openapi: 3.1.0
info:
  title: Client Dashboard API
  version: 1.0.3
  description: >
    Backend API for Client Dashboard.
    Provides authentication and user management for web and mobile clients.

servers:
  - url: https://dev.api.makestack.eu
    description: Dev server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Profile
    description: Profile endpoints
  - name: Orders
    description: Orders endpoints

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/requestcode:
    get:
      tags: [Auth]
      summary: Request account activation code
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
            example: a@a.com
          description: User email to get a code
      responses:
        '200':
          description: Successfully sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeSentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/activate:
    get:
      tags: [Auth]
      summary: Activate account with provided code
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
            example: 086a0
          description: Activation code
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
            example: user@email.com
      responses:
        '200':
          description: Account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountActivatedResponse'
        '400':
          description: Activation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc123; HttpOnly; Secure; SameSite=Strict
              description: HTTP-only cookie containing the refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-activated account log-in attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh cookie
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/resetpassword:
    get:
      tags: [Auth]
      summary: Reset password
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
            example: user@email.com
      responses:
        '204':
          description: Reset password link sent
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/verifyresetcode:
    get:
      tags: [Auth]
      description: Verify reset code
      security: []
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
            example: user@email.com
        - in: query
          name: code
          required: true
          schema:
            type: string
            example: AJH412
      responses:
        '204':
          description: Reset successful
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear refresh token cookie
      responses:
        '204':
          description: Successfully logged out
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /profile/me:
    get:
      tags: [Profile]
      summary: Request profile data
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /profile/changepassword:
    post:
      tags: [Profile]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed successfully
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, oldPassword is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /profile/requestcallback:
    get:
      tags: [Profile]
      summary: Request callback from manager
      responses:
        '204':
          description: Callback requested
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Blocked, inactive or unverified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /profile/requestcalculation:
    post:
      tags: [Profile]
      summary: Request calculation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCalculationRequest'
      responses:
        '200':
          description: Calculation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCalculationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Blocked, inactive or unverified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /orders:
    get:
      tags: [Orders]
      summary: Request orders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Blocked, inactive or unverified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /orders/detailed:
    get:
      tags: [Orders]
      summary: Request detailed order by id
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OrderDetailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Blocked, inactive or unverified user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

components:
  parameters:
    PageParam:
      in: query
      name: page
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
      description: Page
    PageSizeParam:
      in: query
      name: pageSize
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 50
        example: 10
      description: Page size
    StatusParam:
      in: query
      name: status
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
      description: Order status filter
    SortParam:
      in: query
      name: sort
      required: false
      schema:
        $ref: '#/components/schemas/OrderSort'
      description: Sort order

  responses:
    TooManyRequestsError:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: MySecurePass123
        name:
          type: string
          example: John Doe

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          example: MySecurePass123

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          example: MySecurePass123
        newPassword:
          type: string
          minLength: 8
          example: MyNewSecurePass123

    RequestCalculationRequest:
      type: object
      required: [originCountry, transportType, title, weight, volume]
      properties:
        originCountry:
          $ref: '#/components/schemas/OriginCountry'
        transportType:
          $ref: '#/components/schemas/TransportType'
        title:
          type: string
          example: Automotive parts
        weight:
          type: string
          description: Weight in KG
        volume:
          type: string
          description: Volume in m^3
        link:
          type: string
          example: 'https://factory.domain/carparts.png'
        photo:
          type: string
          format: binary
        comment:
          type: string
          example: Please call ASAP

    RequestCalculationResponse:
      type: object
      properties:
        fileUploadFailed:
          type: boolean
          description: True IFF file uploaded failed

    RegisteredResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: Short-lived JWT access token

    AccountInfoResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    ActivationCodeSentResponse:
      type: object
      properties:
        message:
          type: string
          example: Activation code sent

    AccountActivatedResponse:
      type: object
      properties:
        message:
          type: string
          example: Account activated

    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: New JWT access token

    User:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        verifiedClient:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - email
        - verifiedClient
        - createdAt

    OriginCountry:
      type: string
      enum: [china, europe, turkey, other]

    TransportType:
      type: string
      enum: [sea, air, rail, auto]

    OrderStatus:
      type: string
      enum: [new, processing, shipped, delivered, canceled]

    OrderSort:
      type: string
      enum: [dateDesc, dateAsc, statusDesc, statusAsc]

    Order:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatus'
        title:
          type: string
      required: [id, title, code]

    OrderDetailed:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            orderItems:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
          required: [orderItems]

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        raceId:
          type: integer
        name:
          type: string
        marking:
          type: string
        places:
          type: integer
        weight:
          type: integer
        volume:
          type: integer
      required: [id, orderId, raceId, name]

    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        totalPages:
          type: integer
      required: [orders, totalPages]

    OrderDetailedResponse:
      type: object
      properties:
        orderDetailed:
          $ref: '#/components/schemas/OrderDetailed'
      required: [orderDetailed]

    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Invalid email or password
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional additional error context (validation errors, etc.)

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
